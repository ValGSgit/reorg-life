name: Release build (Android)

# Manual only. This builds an artefact and stops — it does not submit to any
# store, and no store credential lives in this repository. Submission is a
# deliberate manual step; see docs/RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options: [preview, production]
      reason:
        description: What this build is for (shown in the run list)
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: EAS build (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A release must be green. Cheaper to fail here than after a 30-minute
      # build, and far cheaper than after submitting.
      - name: Verify before building
        run: npm run verify

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Fail early if EXPO_TOKEN is missing
        if: ${{ secrets.EXPO_TOKEN == '' }}
        run: |
          echo "EXPO_TOKEN is not set. Add it under Settings -> Secrets and"
          echo "variables -> Actions. See docs/RELEASE.md."
          exit 1

      - name: Build
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait

      - name: Where to find it
        run: |
          echo "Build submitted to EAS. Download the artefact from"
          echo "https://expo.dev/accounts -> your project -> Builds."
          echo "Then follow the manual checks in docs/RELEASE.md before submitting."
